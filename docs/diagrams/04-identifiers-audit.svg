<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">Identifiers and Audit Relationship</title><desc id="desc">EXAMPLE VALUES ONLY · database keys versus integration identifiers. Royal Tyres IT Asset Request Tool. Read the accompanying README for implementation notes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1b1b1b"/></marker></defs>
<rect width="1200" height="1050" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111111">
<rect x="40" y="34" width="7" height="73" fill="#d71920"/>
<text x="64" y="52" font-size="16" font-weight="700" letter-spacing="1.2">ROYAL TYRES IT ASSET REQUEST TOOL</text>
<text x="64" y="87" font-size="30" font-weight="700">Identifiers and Audit Relationship</text>
<text x="64" y="115" font-size="18" fill="#52565b">EXAMPLE VALUES ONLY · database keys versus integration identifiers</text>
<text x="1145" y="75" text-anchor="end" font-size="28" font-weight="700" fill="#d71920">04</text>
<g data-card="LOCAL DATABASE · AssetRequest"><rect x="40" y="170" width="460" height="190" rx="7" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="60" y="201" font-size="21" fill="white" font-weight="700" text-anchor="start">LOCAL DATABASE · AssetRequest</text>
<text x="60" y="230" font-size="18" fill="white" font-weight="400" text-anchor="start">id = 6  (local primary key)</text>
<text x="60" y="256" font-size="18" fill="white" font-weight="400" text-anchor="start">status = pending</text>
<text x="60" y="282" font-size="18" fill="white" font-weight="400" text-anchor="start">zendesk_ticket_id = 56</text>
<text x="60" y="308" font-size="18" fill="white" font-weight="400" text-anchor="start">Table: asset_requests</text>
</g>
<g data-card="Zendesk Ticket #56"><rect x="690" y="170" width="470" height="142" rx="7" fill="white" stroke="#bec3c8" stroke-width="1.6"/>
<text x="710" y="201" font-size="21" fill="#111111" font-weight="700" text-anchor="start">Zendesk Ticket #56</text>
<text x="710" y="230" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Generated by Zendesk</text>
<text x="710" y="256" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Stored locally on AssetRequest</text>
<text x="710" y="282" font-size="18" fill="#111111" font-weight="400" text-anchor="start">External ticket ID, not a local foreign key</text>
</g>
<polyline points="500,240 690,240" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="222" font-size="17" fill="#111111" font-weight="400" text-anchor="start">links to</text>
<g data-card="external_id"><rect x="690" y="360" width="470" height="220" rx="7" fill="#fff2f3" stroke="#d71920" stroke-width="1.6"/>
<text x="710" y="391" font-size="21" fill="#111111" font-weight="700" text-anchor="start">external_id</text>
<text x="710" y="420" font-size="18" fill="#111111" font-weight="400" text-anchor="start">royal-tires-asset-6</text>
<text x="710" y="446" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Built deterministically from local ID</text>
<text x="710" y="472" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Sent to Zendesk for correlation</text>
<text x="710" y="498" font-size="18" fill="#111111" font-weight="400" text-anchor="start">NOT encryption · NOT a hash</text>
<text x="710" y="524" font-size="18" fill="#111111" font-weight="400" text-anchor="start">NOT the database primary key</text>
</g>
<polyline points="500,280 600,280 600,415 690,415" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="265,360 265,400" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="LOCAL REQUEST ID · 6"><rect x="40" y="400" width="460" height="130" rx="7" fill="white" stroke="#bec3c8" stroke-width="1.6"/>
<text x="60" y="431" font-size="21" fill="#111111" font-weight="700" text-anchor="start">LOCAL REQUEST ID · 6</text>
<text x="60" y="460" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Generated by PostgreSQL / local DB</text>
<text x="60" y="486" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Primary identifier in the portal</text>
<text x="60" y="512" font-size="18" fill="#111111" font-weight="400" text-anchor="start">One AssetRequest → many AuditLog rows</text>
</g>
<polyline points="265,530 265,640" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="290" y="589" font-size="18" fill="#d71920" font-weight="700" text-anchor="start">one → many</text>
<g data-card="Persisted workflow history"><rect x="40" y="640" width="530" height="175" rx="7" fill="white" stroke="#bec3c8" stroke-width="1.6"/>
<text x="60" y="671" font-size="21" fill="#111111" font-weight="700" text-anchor="start">Persisted workflow history</text>
<text x="60" y="700" font-size="18" fill="#111111" font-weight="400" text-anchor="start">AuditLog #1 · REQUEST_CREATED</text>
<text x="60" y="726" font-size="18" fill="#111111" font-weight="400" text-anchor="start">AuditLog #2 · ZENDESK_TICKET_CREATED</text>
<text x="60" y="752" font-size="18" fill="#111111" font-weight="400" text-anchor="start">AuditLog #3 · ZENDESK_STATUS_CHANGED</text>
<text x="60" y="778" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Each event has request_id = 6</text>
</g>
<g data-card="FOREIGN KEY"><rect x="690" y="640" width="470" height="175" rx="7" fill="#f3f4f5" stroke="#d9dde0" stroke-width="1.6"/>
<text x="710" y="671" font-size="21" fill="#111111" font-weight="700" text-anchor="start">FOREIGN KEY</text>
<text x="710" y="700" font-size="18" fill="#111111" font-weight="400" text-anchor="start">audit_logs.request_id</text>
<text x="710" y="726" font-size="18" fill="#111111" font-weight="400" text-anchor="start">↓</text>
<text x="710" y="752" font-size="18" fill="#111111" font-weight="400" text-anchor="start">asset_requests.id</text>
<text x="710" y="778" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Links each event to its parent request</text>
</g>
<polyline points="570,725 690,725" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="AuditLog is chronological workflow history"><rect x="40" y="855" width="1120" height="75" rx="7" fill="white" stroke="#bec3c8" stroke-width="1.6"/>
<text x="60" y="886" font-size="21" fill="#111111" font-weight="700" text-anchor="start">AuditLog is chronological workflow history</text>
<text x="60" y="915" font-size="18" fill="#111111" font-weight="400" text-anchor="start">It is NOT authentication or session state.</text>
</g>
<path d="M40 961 H1160" stroke="#d9dde0"/>
<text x="44" y="991" font-size="18" fill="#52565b" font-weight="400" text-anchor="start">Local ID and Zendesk ID are generated by different systems; external_id ties them together.</text>
</g></svg>
