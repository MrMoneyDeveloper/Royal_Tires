<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc">
<title id="title">Continuous Integration</title><desc id="desc">GitHub Actions · .github/workflows/ci.yml. Royal Tyres IT Asset Request Tool. Read the accompanying README for implementation notes.</desc>
