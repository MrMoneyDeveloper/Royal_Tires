<g data-card="SEPARATE DEPLOYMENT MECHANISM"><rect x="40" y="1100" width="1120" height="105" rx="7" fill="#fff2f3" stroke="#d71920" stroke-width="1.6"/>
<text x="60" y="1131" font-size="21" fill="#111111" font-weight="700" text-anchor="start">SEPARATE DEPLOYMENT MECHANISM</text>
<text x="60" y="1160" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Main branch change → Render Auto Deploy → Backend + Frontend</text>
<text x="60" y="1186" font-size="18" fill="#111111" font-weight="400" text-anchor="start">CI validates; it does not deploy. No branch-protection enforcement is assumed.</text>
</g>
<path d="M40 1241 H1160" stroke="#d9dde0"/>
<text x="44" y="1271" font-size="18" fill="#52565b" font-weight="400" text-anchor="start">CI = automated verification. Render deployment is separate. No manual deploy is needed for these diagrams.</text>
