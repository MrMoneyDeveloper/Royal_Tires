<text x="260" y="215" font-size="18" fill="white" font-weight="400" text-anchor="start">Pull request targeting main OR push to main</text>
<text x="260" y="241" font-size="18" fill="white" font-weight="400" text-anchor="start">Workflow/ref concurrency cancels superseded runs.</text>
</g>
