<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
<title id="title">Frontend Page and Navigation Flow</title><desc id="desc">App.jsx composes routes · api.js owns browser HTTP. Royal Tyres IT Asset Request Tool. Read the accompanying README for implementation notes.</desc>
