<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">System Architecture</title><desc id="desc">Hosted components and the direction of integration calls. Royal Tyres IT Asset Request Tool. Read the accompanying README for implementation notes.</desc>
