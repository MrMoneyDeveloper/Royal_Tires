</g>
<path d="M40 951 H1160" stroke="#d9dde0"/>
<text x="44" y="981" font-size="18" fill="#52565b" font-weight="400" text-anchor="start">Inbound: POST JSON + separate bearer secret to the same FastAPI backend.</text>
<text x="44" y="1007" font-size="18" fill="#52565b" font-weight="400" text-anchor="start">Frontend never calls Zendesk directly. SQLite is local development/testing only.</text>
