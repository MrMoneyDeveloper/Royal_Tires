name: MVC Finalizer

on:
  push:
    branches:
      - refactor/mvc-physical-structure

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mvc-physical-structure
          fetch-depth: 0

      - name: Apply final MVC alignment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the last compatibility dependency so the service imports the
          # physical data layer directly.
          zendesk = Path('backend/app/services/zendesk_service.py')
          text = zendesk.read_text()
          old = 'from app.database import utc_now'
          new = 'from app.data.base import utc_now'
          if old not in text:
              raise SystemExit('Expected Zendesk database compatibility import was not found.')
          zendesk.write_text(text.replace(old, new, 1))

          # Keep PR17 a structural refactor. Restore the working request-form copy
          # from main and change only the validation import to its new helper path.
          # The shell writes the main version immediately after this script.

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '`backend/app/database.py` remains only as a small compatibility facade for older imports in the large Zendesk integration module. Engine/session/base implementation lives in `data/`; new code imports from the physical data layer.\n',
              'SQLAlchemy infrastructure lives exclusively in `backend/app/data/`. Controllers and services import the data/session modules directly; there is no root database compatibility facade.\n',
          )
          readme.write_text(text)

          spec = Path('PROJECT_SPEC.md')
          text = spec.read_text()

          new_map = '''# 4. Current Physical Repository Map

This is the **actual current code layout** after the MVC physical-structure refactor.

```text
Royal_Tires/
│
├── PROJECT_SPEC.md
├── README.md
├── .github/workflows/ci.yml
│
├── backend/
│   ├── app/
│   │   ├── main.py
│   │   ├── controllers/
│   │   │   ├── request_controller.py
│   │   │   ├── zendesk_controller.py
│   │   │   └── webhook_controller.py
│   │   ├── services/
│   │   │   ├── request_service.py
│   │   │   ├── zendesk_service.py
│   │   │   ├── webhook_service.py
│   │   │   └── legacy_trigger_guard.py
│   │   ├── repositories/
│   │   │   ├── request_repository.py
│   │   │   ├── audit_repository.py
│   │   │   └── zendesk_repository.py
│   │   ├── models/
│   │   │   ├── asset_request.py
│   │   │   ├── audit_log.py
│   │   │   └── zendesk_connection.py
│   │   ├── schemas/
│   │   │   ├── request_schema.py
│   │   │   ├── zendesk_schema.py
│   │   │   └── webhook_schema.py
│   │   ├── data/
│   │   │   ├── base.py
│   │   │   ├── db_context.py
│   │   │   └── session.py
│   │   ├── middleware/
│   │   │   ├── request_logging.py
│   │   │   └── security_headers.py
│   │   ├── helpers/
│   │   │   └── request_identity.py
│   │   └── core/
│   │       ├── config.py
│   │       ├── security.py
│   │       └── logging_config.py
│   └── tests/
│
└── frontend/
    ├── src/
    │   ├── main.jsx
    │   ├── App.jsx
    │   ├── views/
    │   │   ├── RequestView.jsx
    │   │   ├── DashboardView.jsx
    │   │   ├── RequestDetailView.jsx
    │   │   ├── SettingsView.jsx
    │   │   └── ZendeskSetupView.jsx
    │   ├── layouts/
    │   │   ├── AppLayout.jsx
    │   │   └── AuthLayout.jsx
    │   ├── components/
    │   │   ├── shared/
    │   │   │   ├── Brand.jsx
    │   │   │   ├── Sidebar.jsx
    │   │   │   ├── Topbar.jsx
    │   │   │   └── Footer.jsx
    │   │   ├── AppLink.jsx
    │   │   ├── AssetRequestForm.jsx
    │   │   ├── StatusBadge.jsx
    │   │   └── SyncStatePanel.jsx
    │   ├── services/api.js
    │   └── helpers/
    │       ├── formatting.js
    │       └── validation.js
    └── tests/
```

The physical folders now match the MVC mental model. There are no compatibility facade modules for the old root `repository.py`, `schemas.py` or `database.py` locations.

---

# 5. Model Layer'''
          text, count = re.subn(
              r'# 4\. Current Physical Repository Map.*?---\n\n# 5\. Model Layer',
              new_map,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace PROJECT_SPEC physical repository map.')

          text = text.replace(
              '| Repository | SQLAlchemy data access functions |',
              '| Repository | SQLAlchemy data access in `backend/app/repositories/` |',
          )
          text = text.replace(
              '| DbContext | `database.py`, SQLAlchemy engine, Base and scoped Session |',
              '| DbContext | `backend/app/data/` (`base.py`, `db_context.py`, `session.py`) |',
          )
          text = text.replace(
              '| ViewModel / DTO | Pydantic schemas in `backend/app/schemas.py` |',
              '| ViewModel / DTO | Pydantic schemas in `backend/app/schemas/` |',
          )

          # Replace the old repository/data/schema/middleware/helper location prose
          # with statements that describe the physical structure that now exists.
          text = text.replace('Current physical location:\n\n```text\nbackend/app/repository.py\n```', 'Current physical location:\n\n```text\nbackend/app/repositories/\n```')
          text = text.replace('Current physical location:\n\n```text\nbackend/app/schemas.py\n```', 'Current physical location:\n\n```text\nbackend/app/schemas/\n```')
          text = text.replace('For the MVC mental model, the following current code is the **DbContext equivalent**:\n\n```text\nbackend/app/database.py\n```', 'For the MVC mental model, the SQLAlchemy **DbContext equivalent** is physically split by responsibility:\n\n```text\nbackend/app/data/base.py\nbackend/app/data/db_context.py\nbackend/app/data/session.py\n```')
          text = text.replace('Current middleware behavior is partly defined directly in:\n\n```text\nbackend/app/main.py\n```', 'Current middleware is physically isolated in:\n\n```text\nbackend/app/middleware/request_logging.py\nbackend/app/middleware/security_headers.py\n```')
          text = text.replace('There is not currently a dedicated `helpers/` folder. Some helper-like logic currently lives close to the Services/Core code that uses it.', 'Dedicated helper folders now contain small reusable pure utilities without owning business workflow.')
          text = text.replace('`App.jsx` currently owns routing/session/application-shell behavior. Shared layout responsibilities can later be extracted into layout/shared components without changing application behavior.', '`App.jsx` owns routing/session composition. `AppLayout.jsx` and `AuthLayout.jsx` own the shared shells, while `components/shared/` contains reusable navigation/brand/footer partials.')

          # Flow diagrams should point to the physical layers, not retired facade files.
          text = text.replace('schemas.py                              DTO / VALIDATION', 'schemas/request_schema.py               DTO / VALIDATION')
          text = text.replace('repository.py                           REPOSITORY', 'repositories/request_repository.py      REPOSITORY')
          text = text.replace('database.py                             DB CONTEXT', 'data/db_context.py + data/session.py     DB CONTEXT')
          text = text.replace('repository/database access              REPOSITORY', 'repositories/request_repository.py      REPOSITORY')
          text = text.replace('database.py / Session                   DB CONTEXT', 'data/db_context.py / session.py          DB CONTEXT')

          text = text.replace('React + Vite on Vercel', 'React + Vite on Render Static Sites')
          text = text.replace('Frontend / Vercel:', 'Frontend / Render Static Site:')
          spec.write_text(text)
          PY

          # Restore the pre-refactor form wording and behavior, changing only the
          # helper import required by the new folder structure.
          git show origin/main:frontend/src/components/AssetRequestForm.jsx > frontend/src/components/AssetRequestForm.jsx
          sed -i "s#../services/validation.js#../helpers/validation.js#" frontend/src/components/AssetRequestForm.jsx

          rm -f backend/app/database.py
          rm -f .github/workflows/mvc-finalize.yml

          # Hard fail if code still depends on the retired compatibility module.
          if grep -R "app\.database" -n backend/app backend/tests; then
            echo "Retired app.database import still exists." >&2
            exit 1
          fi

          git config user.name "MrMoneyDeveloper"
          git config user.email "mohammedfarhaanbuckas@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: finalize physical MVC layout"
          git push origin HEAD:refactor/mvc-physical-structure
